<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Wallet Body -->
  <g filter="url(#glow)">
    <!-- Back flap -->
    <rect x="116" y="146" width="280" height="220" rx="32" fill="#1e293b" stroke="#334155" stroke-width="6" />

    <!-- Front main fold -->
    <path d="M 116 190 Q 116 160 146 160 L 366 160 Q 396 160 396 190 L 396 336 Q 396 366 366 366 L 146 366 Q 116 366 116 336 Z" fill="url(#emeraldGrad)" />

    <!-- Wallet flap strap -->
    <path d="M 290 220 L 396 220 L 396 306 L 290 306 Q 260 306 260 263 Q 260 220 290 220 Z" fill="#065f46" stroke="#047857" stroke-width="4" />

    <!-- Metal clasp / coin center -->
    <circle cx="300" cy="263" r="16" fill="#f8fafc" />
    <circle cx="300" cy="263" r="10" fill="#34d399" />

    <!-- Cash bill peeking from top -->
    <rect x="166" y="126" width="180" height="40" rx="8" fill="#6ee7b7" opacity="0.9" />
    <line x1="196" y1="146" x2="316" y2="146" stroke="#065f46" stroke-width="4" stroke-dasharray="8 6" />
  </g>
</svg>
